[project]
name = "tlv-pipeline"
version = "1.0.0"
description = "Tel Aviv street-closure compensation — PySpark medallion pipeline"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<5", "pyyaml>=6", "pandas>=2", "pyarrow>=14"]

[project.scripts]
tlv-pipeline = "tlv_pipeline.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
